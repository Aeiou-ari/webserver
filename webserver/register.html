<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            background-color: #fff5f8;
            color: #444;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#ffd6e4 8%, transparent 8%);
            background-size: 30px 30px;
        }

        .register-card {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 48px 32px 36px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(255, 179, 204, 0.25);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #ff7aa2;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #b88899;
            font-size: 15px;
            margin-bottom: 36px;
        }

        .input-item {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border: 1.5px solid #ffc8da;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fff9fb;
        }

        .input-item:focus {
            border-color: #ff7aa2;
            box-shadow: 0 0 0 3px rgba(255, 122, 162, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            margin-top: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-register {
            background-color: #ff7aa2;
            color: #fff;
        }

        .btn-register:hover {
            background-color: #ff608e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 122, 162, 0.3);
        }

        .footer-text {
            margin-top: 24px;
            font-size: 13px;
            color: #d4a0b2;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <h1>账号注册</h1>
        <p class="subtitle">用户注册</p>

        <!-- POST提交到 /register 路由 -->
        <form action="/register" method="POST">
            <input type="text" name="username" class="input-item" placeholder="请输入用户名" required>
            <input type="password" name="password" class="input-item" placeholder="请输入密码" required>
            <input type="password" name="repwd" class="input-item" placeholder="请再次输入密码" required>

            <button class="btn btn-register" type="submit">确认注册</button>
        </form>

        <div class="footer-text">
            Online Mall 注册
        </div>
    </div>
</body>
</html>
