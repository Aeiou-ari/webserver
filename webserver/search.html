<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>商品搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #fff0f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .search-box {
            background-color: #ffffff;
            width: 420px;
            padding: 40px 35px;
            border-radius: 22px;
            box-shadow: 0 6px 18px #ffc8dd88;
        }
        .search-box h2 {
            text-align: center;
            color: #d87093;
            margin-bottom: 32px;
            font-weight: 500;
        }
        .input-item {
            margin-bottom: 24px;
        }
        .input-item input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ffc0cb;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            background-color: #fff7fa;
        }
        .input-item input:focus {
            border-color: #f48fb1;
        }
        .btn-search {
            width: 100%;
            padding:14px;
            border-radius:14px;
            border: none;
            background-color:#f48fb1;
            color:#ffffff;
            font-size:17px;
            cursor:pointer;
            transition: 0.25s;
        }
        .btn-search:hover {
            background-color:#ec78a0;
        }
    </style>
</head>
<body>
    <div class="search-box">
        <h2>商品搜索</h2>
        <!-- form表单，点击搜索按钮会提交Post请求到 /search -->
        <form method="POST" action="/search" >
            <div class="input-item">
                <input type="text" name="keyword" placeholder="请输入商品名称..." />
            </div>
            <button class="btn-search" type="submit">搜索</button>
        </form>
    </div>
</body>
</html>
